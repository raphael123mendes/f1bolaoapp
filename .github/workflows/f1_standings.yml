name: F1 Fantasy Standings

# Start by hand (Actions → F1 Fantasy Standings → Run workflow) up to 2 hours
# before qualifying, the sprint or the race. One run covers the whole session
# (session mode) and publishes live/*.json at checkpoints, then stops.
# (GitHub's own schedule was too unreliable — runs came hours late.)
on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "1 = one immediate update and exit (no session mode). Leave 0 normally."
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]
      force_round:
        description: "Force a specific round number (e.g. 3 for Japan). Requires force_run=1."
        required: false
        default: ""

# Never run two live updates at the same time (they would race on the push)
concurrency:
  group: f1-live-standings
  cancel-in-progress: false

jobs:
  standings:
    runs-on: ubuntu-latest
    # Session mode: up to 2 h waiting for the start + the session itself
    # (race + delays + 45 min settle). 360 min is GitHub's maximum.
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run F1 standings bot
        env:
          FORCE_RUN:          ${{ github.event.inputs.force_run || '0' }}
          FORCE_ROUND:        ${{ github.event.inputs.force_round || '' }}
          F1_COOKIE:          ${{ secrets.F1_COOKIE }}
          SESSION_MODE:       "1"   # "0" = old behaviour (one update per run)
        run: python bot/f1_quick.py

      # One commit per run with all live files + bot state (only if something changed)
      - name: Commit live data
        if: success()
        run: |
          git config user.name "F1 Bot"
          git config user.email "f1bot@github.com"
          git add live/*.json bot/last_standings.json 2>/dev/null || true
          git diff --staged --quiet && { echo "Nothing changed"; exit 0; }
          git commit -m "live update [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
