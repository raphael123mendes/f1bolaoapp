name: Update F1 Session Status JSON

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch F1 Data and Generate JSON
        run: node scripts/fetch-f1-status.js

      - name: Commit and Push updated race_status.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/race_status.json
          git commit -m "update: refresh race status JSON [skip ci]" || exit 0
          git push
