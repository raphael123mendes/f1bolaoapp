name: F1 Fantasy Standings

on:
  schedule:
    # Runs every 10 minutes, Saturdays + Sundays, 03:00-22:00 UTC
    - cron: "*/10 3-22 * * 0,6"

  workflow_dispatch:
    inputs:
      force_run:
        description: "Force send even outside race window"
        required: false
        default: "0"
        type: choice
        options: ["0", "1"]
      force_round:
        description: "Force a specific round number (e.g. 3 for Japan). Requires force_run=1."
        required: false
        default: ""

# Never run two live updates at the same time (they would race on the push)
concurrency:
  group: f1-live-standings
  cancel-in-progress: false

jobs:
  standings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run F1 standings bot
        env:
          FORCE_RUN:          ${{ github.event.inputs.force_run || '0' }}
          FORCE_ROUND:        ${{ github.event.inputs.force_round || '' }}
          F1_COOKIE:          ${{ secrets.F1_COOKIE }}
        run: python bot/f1_quick.py

      # One commit per run with all live files + bot state (only if something changed)
      - name: Commit live data
        if: success()
        run: |
          git config user.name "F1 Bot"
          git config user.email "f1bot@github.com"
          git add live/*.json bot/last_standings.json 2>/dev/null || true
          git diff --staged --quiet && { echo "Nothing changed"; exit 0; }
          git commit -m "live update [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
