name: F1 Live Timing Test

# Run by hand DURING a session (qualifying / sprint / race).
# Checks whether the bot can read F1's live timing basics (status, Q1/Q2/Q3,
# lap count, flags): first with no login, then with the existing F1_COOKIE.
# Prints a summary only — nothing is saved, no cookie value is printed.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to listen per attempt (seconds)"
        required: false
        default: "90"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests websocket-client
      - name: Test live timing
        env:
          F1_COOKIE:  ${{ secrets.F1_COOKIE }}
          LT_SECONDS: ${{ github.event.inputs.seconds || '90' }}
        run: python bot/livetiming_test.py
